<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reduced motion state change</title>
<style>
  body { font: 1rem/1.5 system-ui; padding: 1rem; color: #17212b; background: #fff; }
  button { font: inherit; padding: .75rem; }
  :focus-visible { outline: 3px solid #1554b3; outline-offset: 3px; }
  @media (prefers-reduced-motion: no-preference) {
    #details:not([hidden]) { animation: enter .2s ease-out; }
    @keyframes enter { from { opacity: .4; transform: translateY(.4rem); } to { opacity: 1; transform: none; } }
  }
</style>
<main>
  <h1>Motion is optional</h1>
  <button id="toggle" type="button" aria-expanded="true" aria-controls="details" hidden>Hide details</button>
  <p id="details">Details remain available with or without animation.</p>
</main>
<script>
  const toggle = document.getElementById("toggle");
  const details = document.getElementById("details");
  details.hidden = true;
  toggle.hidden = false;
  toggle.textContent = "Show details";
  toggle.setAttribute("aria-expanded", "false");
  toggle.addEventListener("click", () => {
    details.hidden = !details.hidden;
    toggle.setAttribute("aria-expanded", String(!details.hidden));
    toggle.textContent = details.hidden ? "Show details" : "Hide details";
  });
</script>
</html>
