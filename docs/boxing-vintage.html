<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>매일 한 라운드 — 빈티지 시안</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #d3cec2; color: #8d2218; font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif; }
    main { width: min(100%, 800px); margin: auto; padding: 20px; }
    .label, footer { display: flex; justify-content: space-between; gap: 20px; font-size: 11px; line-height: 1.8; }
    .label { margin-bottom: 12px; color: #4f493e; }
    .poster { position: relative; aspect-ratio: 4 / 5; background: #ece5d4; isolation: isolate; overflow: hidden; }
    .paper { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 4; }
    h1 { position: absolute; z-index: 1; top: 3%; left: 5%; margin: 0; font-size: clamp(82px, 25vw, 198px); font-weight: 950; line-height: 1.03; letter-spacing: -.09em; color: #bb291c; }
    h1 span { display: block; }
    h1 span:last-child { font-size: .65em; margin-top: .08em; }
    .boxer { position: absolute; width: 65%; height: 69%; left: 31%; top: 28%; z-index: 3; }
    .line { position: absolute; left: 6%; right: 6%; top: 55%; display: flex; justify-content: space-between; gap: 12px; font-size: clamp(12px, 2.5vw, 19px); font-weight: 700; z-index: 2; }
    .edition { position: absolute; left: 6%; bottom: 5%; z-index: 3; font-size: clamp(9px, 1.7vw, 13px); line-height: 1.8; }
    .edition p { margin: 0; }
    .edition b { display: block; font-size: clamp(12px, 2.3vw, 18px); }
    .bars { display: flex; gap: 3px; margin-top: 12px; height: 16px; }
    .bars i { width: 3px; background: #8d2218; }
    .bars i:nth-child(3n) { width: 7px; }
    footer { margin-top: 14px; align-items: start; color: #4f493e; }
    footer p { margin: 0; }
    a { color: inherit; text-underline-offset: 4px; min-height: 44px; display: inline-flex; align-items: center; }
    a:focus-visible { outline: 2px solid #8d2218; outline-offset: 4px; }
    @media (max-width: 500px) { main { padding: 12px; } footer { flex-wrap: wrap; } .bars { height: 10px; gap: 2px; margin-top: 8px; } }
  </style>
</head>
<body>

      <svg class="paper" aria-hidden="true" focusable="false">

    <footer><p>종이색 · 붉은 대형 글자 · 앞에 겹친 인물.<br>사진 대신 독자적인 SVG 일러스트를 사용했습니다.</p><a href="./boxing-references.md#vintage">참고·제작 안내</a></footer>

</body>
</html>
