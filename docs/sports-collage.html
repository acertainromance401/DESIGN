<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>경기 사이 — 스포츠 사진 콜라주</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; color: #18251c; background: #e8eae4; font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
    main { max-width: 820px; margin: auto; padding: 28px 24px 18px; }
    .caption { display: flex; justify-content: space-between; gap: 20px; font-size: 11px; margin: 0 0 14px; line-height: 1.7; }
    .caption span:last-child { color: #52604e; }
    .poster { aspect-ratio: 3 / 4; background: #fff; position: relative; isolation: isolate; }
    .frame { position: absolute; overflow: hidden; border-radius: 24px; background: #15231a; }
    .frame img { display: block; width: 100%; height: 100%; object-fit: cover; }
    .opening { left: 3%; top: 2.3%; width: 94%; height: 28%; }
    .opening img { object-position: 50% 14%; filter: grayscale(1); opacity: .5; }
    .heading { position: absolute; left: 8%; top: 6%; z-index: 1; color: #fff; }
    .heading p { margin: 0 0 10px; font-size: clamp(9px, 1.8vw, 13px); letter-spacing: .04em; }
    h1 { margin: 0; font-size: clamp(42px, 10vw, 88px); letter-spacing: -.065em; line-height: 1; font-weight: 800; }
    .heading .issue { margin: 14px 0 0; font-size: clamp(10px, 2vw, 15px); }
    .eyes { left: 0; top: 31.3%; width: 97%; height: 21%; border-radius: 0 22px 22px 0; background: #aeada5; }
    .eyes img { position: absolute; width: 400%; height: auto; max-width: none; left: -200%; top: -200%; filter: saturate(.6); }
    .field { left: 3%; top: 53.4%; width: 94%; height: 43.7%; }
    .field img { object-position: 41% 85%; filter: saturate(.65); }
    .field::after { content: ""; position: absolute; inset: 40% 0 0; background: linear-gradient(transparent, #061408d9); }
    .foreground { position: absolute; right: -1%; top: 20%; width: 62%; height: 78%; z-index: 2; overflow: visible; pointer-events: none; }
    .match-note { position: absolute; z-index: 3; left: 8%; bottom: 6%; color: #fff; max-width: 36%; }
    .match-note p { margin: 0; font-size: clamp(12px, 2.7vw, 20px); line-height: 1.5; font-weight: 600; word-break: keep-all; }
    .match-note small { display: block; margin-top: 12px; font-size: clamp(9px, 1.6vw, 12px); line-height: 1.8; }
    .accent { width: 28px; height: 6px; background: #e96a3b; margin-bottom: 16px; }
    .bottom { display: flex; justify-content: space-between; gap: 18px; margin-top: 16px; font-size: 11px; line-height: 1.8; }
    .bottom p { margin: 0; max-width: 500px; }
    a { color: inherit; text-underline-offset: 4px; }
    a:focus-visible { outline: 2px solid #18251c; outline-offset: 5px; }
    .bottom a { display: inline-flex; min-height: 44px; align-items: center; flex-shrink: 0; }
    @media (max-width: 500px) {
      main { padding: 16px 12px; }
      .caption { font-size: 10px; gap: 12px; }
      .frame { border-radius: 14px; }
      .eyes { border-radius: 0 14px 14px 0; }
      .bottom { flex-direction: column; gap: 4px; }
      .accent { width: 20px; height: 4px; margin-bottom: 10px; }
      .match-note small { margin-top: 7px; }
    }
  </style>
</head>
<body>
